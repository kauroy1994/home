name: Build faculty CV PDF
on:
  push:
    branches: [master]
    paths:
      - 'scripts/build_cv.py'
      - 'scripts/cv_reference.txt'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato fonts-liberation
          pip install reportlab==4.2.5
      - run: python scripts/build_cv.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/Kaushik_Roy_CV_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed editorial faculty CV"
            git push
          fi
